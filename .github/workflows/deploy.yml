name: Build and Deploy to Dokploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Never build two images for the same branch at once — they race on the `latest`
  # tag and on the shared :buildcache ref. Newer pushes queue instead of cancelling
  # so a half-pushed image is never left behind.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-deploy:
    name: Build and Deploy
    needs: ci
    # Pin to Linux self-hosted runner pool. Bare `self-hosted` can also match
    # `mac-mini`, which fails GHCR push with anonymous-token 403.
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    environment: preview
    permissions:
      contents: read
      packages: write
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: coach
          keep-state: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          if [ -z "${DOKPLOY_WEBHOOK:-}" ]; then
            echo "::warning::DOKPLOY_WEBHOOK_URL is not set. Skipping webhook trigger."
            exit 0
          fi

          RESPONSE_BODY=$(mktemp)
          HTTP_CODE=$(curl -sS -X POST \
            --retry 3 --retry-delay 5 --retry-connrefused \
            --connect-timeout 10 --max-time 60 \
            -o "${RESPONSE_BODY}" \
            -w '%{http_code}' \
            "${DOKPLOY_WEBHOOK}") || HTTP_CODE="000"

          # A non-2xx response used to pass silently: the image was pushed, nothing
          # was deployed, and the Discord notification still said "success".
          case "${HTTP_CODE}" in
            2??)
              echo "✅ Dokploy deployment triggered (HTTP ${HTTP_CODE})"
              ;;
            *)
              echo "::error::Dokploy webhook failed (HTTP ${HTTP_CODE}). Image was pushed to ghcr.io but the deployment was NOT triggered."
              head -c 2000 "${RESPONSE_BODY}" || true
              exit 1
              ;;
          esac

      - name: Discord Notification
        uses: sarisia/actions-status-discord@v1
        if: always() && env.DISCORD_WEBHOOK != ''
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          title: 'Deploy Status - ${{ github.repository }}'
          description: |
            **Deploy:** ${{ job.status }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** [${{ github.sha }}](${{ github.event.head_commit.url }})
          color: ${{ job.status == 'success' && '0x28a745' || '0xdc3545' }}

  deploy-trigger:
    name: Deploy Trigger.dev
    needs: build-and-deploy
    uses: ./.github/workflows/reusable-trigger-deploy.yml
    with:
      environment: preview
      trigger-env: preview
      trigger-version: '4.5.4'
      preview-branch: false
    secrets: inherit
