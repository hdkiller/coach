name: E2E

# Runs on:
# 1. Manual trigger (workflow_dispatch)
# 2. Pull Requests targeting `master`
# 3. Pull Requests labeled with `run-e2e`
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (branch, tag, or SHA)
        required: true
        default: develop
        type: string
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-mac-mini
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: [self-hosted, e2e]
    timeout-minutes: 120
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'master' ||
      contains(github.event.pull_request.labels.*.name, 'run-e2e')

    env:
      DOCKER_BUILDKIT: '1'
      COMPOSE_DOCKER_CLI_BUILD: '1'
      PLAYWRIGHT_BROWSERS_PATH: '~/.cache/ms-playwright'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare e2e env
        run: |
          cp .env.e2e.example .env.e2e

      - name: Free e2e ports / previous stack
        run: |
          pnpm e2e:down || true
          if lsof -tiTCP:3199 -sTCP:LISTEN >/dev/null 2>&1; then
            lsof -tiTCP:3199 -sTCP:LISTEN | xargs kill || true
            sleep 2
          fi

      - name: Build and start Docker e2e stack
        run: pnpm e2e:setup

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run Playwright
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down e2e stack
        if: always()
        run: pnpm e2e:down
