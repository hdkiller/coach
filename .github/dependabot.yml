version: 2
updates:
  # Maintain dependencies for npm / pnpm package ecosystem
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'security'

  # Maintain updates for GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'develop'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    labels:
      - 'ci'
      - 'dependencies'
